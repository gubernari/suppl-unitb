likelihoods:
  - name: Bpi-LCSR
    constraints:
      - B->pi::form-factors[f_+,f_0,f_T]@LMvD:2021A
      - B->pi::FormFactors[f_+,f_0,f_T]@GKvD:2018A

  - name: Bpi-LQCD
    constraints:
      - B->pi::f_0+f_+@FLAG:2024A

  - name: BsK-LCSR
    constraints:
      - B_s->K::FormFactorsLCSR@BGMT:2025A
      - B_s->K::form-factors[f_+,f_0,f_T]@BvDV:2023A

  - name: BsK-LQCD
    constraints:
      - B_s->K::f_0+f_+@FLAG:2024A

  - name: BsKstar-LCSR
    constraints:
      - B_s->K^*::FormFactorsLCSR@BGMT:2025A
      - B_s->K^*::FormFactors[A_0,A_1,A_2,V,T_1,T_2,T_23]@BSZ:2015A

  - name: BsKstar-LQCD
    constraints:
      - B_s->K^*::V+A_0+A_1+A_12@HLMW:2015A
      - B_s->K^*::T_1+T_2+T_23@HLMW:2015A

  - name: bu-unitarity-bounds
    manual_constraints:
      'b->u::MesonicBound[A0]@G':
        type: UniformBound
        observables:
            - 'B_s->K^*::Saturation[A0]@G'
        kinematics: [ {} ]
        options: [ {} ]
        bound: 1.0
        uncertainty: 0.05
      'b->u::MesonicBound[V0]@G':
        type: UniformBound
        observables:
            - 'B->pi::Saturation[V0]@G'
            - 'B_s->K::Saturation[V0]@G'
        kinematics: [ {}, {} ]
        options: [ {}, {} ]
        bound: 1.0
        uncertainty: 0.05
      'b->u::MesonicBound[V1]@G':
